[project]
name = "sbob"
version = "1.0.8"
description = "Da una registrazione a materiale di studio, tutto in locale"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fabio" }]
keywords = ["transcription", "whisper", "ollama", "study", "local-first"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Topic :: Education",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "reportlab>=4.2",
  "yt-dlp>=2025.1.1",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
mac = ["mlx-whisper>=0.4"]
linux = ["faster-whisper>=1.1"]
voci = ["pyannote.audio>=3.3", "torch>=2.3"]
dev = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/BiofaOfficial/Sbob"
Issues = "https://github.com/BiofaOfficial/Sbob/issues"

[project.scripts]
sbob = "sbob.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sbob"]

[tool.hatch.build.targets.wheel.force-include]
"sbob/static" = "sbob/static"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["sbob/static", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = [
  "E501",  # i prompt sono righe lunghe per scelta
  "B008",  # File()/Form() nei default: idioma di FastAPI
  "S603",  # subprocess con lista di argomenti, mai shell=True
  "S607",  # ffmpeg/ffprobe/caffeinate si cercano nel PATH
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
