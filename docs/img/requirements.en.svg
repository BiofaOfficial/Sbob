<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Sbob requirements: a Mac with an Apple chip or an Ubuntu PC, 16 GB of memory, 20 to 30 GB of free disk space" font-family="system-ui,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<rect x="0.5" y="0.5" width="859" height="329" rx="22" fill="#ecfdf5" stroke="#a7f3d0"/>
<rect x="24" y="24" width="394" height="176" rx="16" fill="#ffffff" stroke="#a7f3d0"/>
<rect x="46" y="44" width="44" height="44" rx="12" fill="#d1fae5"/>
<rect x="57" y="56" width="22" height="15" rx="2.5" fill="none" stroke="#047857" stroke-width="2.4"/><path d="M53 76 h30" stroke="#047857" stroke-width="2.6" stroke-linecap="round"/>
<text x="104" y="74" font-size="24" font-weight="700" fill="#064e3b">Mac</text>
<circle cx="56" cy="117" r="9" fill="#d1fae5"/><path d="M51.5 117 l3 3.2 l5.5 -6.2" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="122" font-size="15.5" fill="#1f2937">Apple chip: M1 or later</text>
<circle cx="56" cy="144" r="9" fill="#d1fae5"/><path d="M51.5 144 l3 3.2 l5.5 -6.2" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="149" font-size="15.5" fill="#1f2937">macOS 14 Sonoma or later</text>
<circle cx="56" cy="171" r="9" fill="#d1fae5"/><path d="M51.5 171 l3 3.2 l5.5 -6.2" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="176" font-size="15.5" fill="#1f2937">Uses the Mac's own graphics chip</text>
<rect x="442" y="24" width="394" height="176" rx="16" fill="#ffffff" stroke="#a7f3d0"/>
<rect x="464" y="44" width="44" height="44" rx="12" fill="#d1fae5"/>
<rect x="473" y="55" width="26" height="22" rx="4" fill="none" stroke="#047857" stroke-width="2.4"/><path d="M478 62 l4.5 4 l-4.5 4 M486 71 h7" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="522" y="74" font-size="24" font-weight="700" fill="#064e3b">Linux</text>
<circle cx="474" cy="117" r="9" fill="#d1fae5"/><path d="M469.5 117 l3 3.2 l5.5 -6.2" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="494" y="122" font-size="15.5" fill="#1f2937">Ubuntu 22.04 or later</text>
<circle cx="474" cy="144" r="9" fill="#d1fae5"/><path d="M469.5 144 l3 3.2 l5.5 -6.2" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="494" y="149" font-size="15.5" fill="#1f2937">NVIDIA card? Sbob uses it: fast</text>
<circle cx="474" cy="171" r="9" fill="#d1fae5"/><path d="M469.5 171 l3 3.2 l5.5 -6.2" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="494" y="176" font-size="15.5" fill="#1f2937">No card? Works on the CPU, slower</text>
<rect x="24" y="216" width="264" height="90" rx="16" fill="#d1fae5"/><text x="44" y="251" font-size="26" font-weight="700" fill="#047857">16 GB</text><text x="44" y="274" font-size="15" font-weight="600" fill="#064e3b">of memory</text><text x="44" y="294" font-size="13" fill="#065f46">24 GB is more comfortable</text><rect x="298" y="216" width="264" height="90" rx="16" fill="#d1fae5"/><text x="318" y="251" font-size="26" font-weight="700" fill="#047857">20–30 GB</text><text x="318" y="274" font-size="15" font-weight="600" fill="#064e3b">of free disk space</text><text x="318" y="294" font-size="13" fill="#065f46">for the models, downloaded once</text><rect x="572" y="216" width="264" height="90" rx="16" fill="#d1fae5"/><text x="592" y="251" font-size="26" font-weight="700" fill="#047857">Offline</text><text x="592" y="274" font-size="15" font-weight="600" fill="#064e3b">after setup</text><text x="592" y="294" font-size="13" fill="#065f46">internet only to install</text>
</svg>
