<circle cx="56" cy="171" r="9" fill="#d1fae5"/><path d="M51.5 171 l3 3.2 l5.5 -6.2" fill="none" stroke="#047857" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="76" y="176" font-size="15.5" fill="#1f2937">Usa il chip grafico del Mac</text>
<rect x="442" y="24" width="394" height="176" rx="16" fill="#ffffff" stroke="#a7f3d0"/>
