<rect x="24" y="216" width="264" height="90" rx="16" fill="#d1fae5"/><text x="44" y="251" font-size="26" font-weight="700" fill="#047857">16 GB</text><text x="44" y="274" font-size="15" font-weight="600" fill="#064e3b">di memoria</text><text x="44" y="294" font-size="13" fill="#065f46">con 24 GB si sta più comodi</text><rect x="298" y="216" width="264" height="90" rx="16" fill="#d1fae5"/><text x="318" y="251" font-size="26" font-weight="700" fill="#047857">20–30 GB</text><text x="318" y="274" font-size="15" font-weight="600" fill="#064e3b">di spazio libero</text><text x="318" y="294" font-size="13" fill="#065f46">per i modelli, scaricati una volta</text><rect x="572" y="216" width="264" height="90" rx="16" fill="#d1fae5"/><text x="592" y="251" font-size="26" font-weight="700" fill="#047857">Offline</text><text x="592" y="274" font-size="15" font-weight="600" fill="#064e3b">dopo l'installazione</text><text x="592" y="294" font-size="13" fill="#065f46">internet serve solo per installare</text>
